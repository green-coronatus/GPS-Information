<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>GPSテスト</title>
</head>
<body style="padding:30px;">

<button onclick="startGps()" style="font-family:Hiragino Sans; font-size:24pt;">
開始
</button>

<button onclick="stopGps()" style="font-family:Hiragino Sans; font-size:24pt;">
停止
</button>

<button onclick="showElevation()" style="font-family:Hiragino Sans; font-size:24pt;">
標高取得
</button>

<p style="font-family:Hiragino Sans; font-size:18pt;">
緯度: <span id="latitude">---</span>
</p>

<p style="font-family:Hiragino Sans; font-size:18pt;">
経度: <span id="longitude">---</span>
</p>

<p style="font-family:Hiragino Sans; font-size:18pt;">
GPS高度:
<span id="gpsAltitude">---</span>
</p>

<p style="font-family:Hiragino Sans; font-size:18pt;">
地理院標高:
<span id="elevation">---</span>
</p>

<script src="app.js"></script>

</body>
</html>
