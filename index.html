<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>GPSテスト</title>
</head>
<body style="padding:30px;">

<button onclick="startGps()">
開始
</button>

<button onclick="stopGps()">
停止
</button>

<button onclick="showElevation()">
標高取得
</button>

<p>
緯度: <span id="latitude">---</span>
</p>

<p>
経度: <span id="longitude">---</span>
</p>

<p>
GPS高度:
<span id="gpsAltitude">---</span>
</p>

<p>
地理院標高:
<span id="elevation">---</span>
</p>

<script src="app.js"></script>

</body>
</html>
